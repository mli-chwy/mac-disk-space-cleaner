name: Source package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Standard public runners: x64 and arm64, no large/xlarge paid labels.
        os: [macos-15-intel, macos-15]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend checks
        run: |
          python -m py_compile server.py launcher.py scripts/build_release.py
          python - <<'PYTEST'
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', '.', '-p', 'test_*.py', '-v'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout)
          if result.returncode:
              tail = result.stdout[-24000:]
              for index in range(0, len(tail), 2500):
                  detail = tail[index:index + 2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Regression failure part {index // 2500 + 1}::' + detail)
          raise SystemExit(result.returncode)
          PYTEST
      - name: JavaScript and shell checks
        run: |
          node --check app.js
          node --check classic.js
          node --check static/app.js
          bash -n scripts/install_macos.sh
          bash -n 安装到应用程序.command
          bash -n 启动磁盘空间管理.command
      - name: Source distribution
        run: python scripts/build_release.py --output "$RUNNER_TEMP/release"
      - name: Installer smoke test in temporary directories
        run: |
          export ATLAS_PYTHON="$(command -v python)"
          export ATLAS_STATE_DIR="$RUNNER_TEMP/atlas-state"
          bash scripts/install_macos.sh --applications-dir "$RUNNER_TEMP/apps" --desktop-dir "$RUNNER_TEMP/desktop" --no-register
          test -x "$RUNNER_TEMP/apps/磁盘空间管理.app/Contents/MacOS/applet"
          test -L "$RUNNER_TEMP/desktop/磁盘空间管理.app"
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-macos-15-python-3.12
          path: release
      - name: Publish verified source package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "磁盘空间管理 $GITHUB_REF_NAME" --notes-file CHANGELOG.md release/*
